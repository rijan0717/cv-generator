<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart CV Generator</title>

    <!--
      No tab icon is declared for now, so the browser falls back to its own
      default and asks once for /favicon.ico, which 404s in the console.
      That is the known cost of leaving it out rather than a fault.

      The artwork itself is still in /public/cv-icon.jpg and is still what
      the navigation bar shows; restoring the tab icon is one line:

        <link rel="icon" type="image/jpeg" href="/cv-icon.jpg" />
    -->

    <meta name="theme-color" content="#faf4e8" />
    <meta
      name="description"
      content="Build professional CVs and check how well they match a job description."
    />

    <!--
      The twelve fonts offered in the CV customisation panel (FONT_STACKS in
      src/templates/templateUtils.js). Two of them do double duty as the
      interface's own faces: Playfair Display for headlines and the
      wordmark, Lora for body text. Both are already in the list for the
      templates, so the interface's typography costs no extra request —
      only the heavier weights it needs, which are added below.
      They are loaded here rather than per template so that a font is already
      available the moment the user selects it, and so the PDF print page can
      wait on document.fonts.ready before rendering.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Roboto+Slab:wght@300;400;700&family=Source+Sans+3:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&family=Raleway:wght@300;400;600;700&family=Lora:wght@400;500;600;700&family=EB+Garamond:wght@400;600;700&family=Oswald:wght@300;400;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
