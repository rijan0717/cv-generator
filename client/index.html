<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart CV Generator</title>
    <meta
      name="description"
      content="Build professional CVs and check how well they match a job description."
    />

    <!--
      The six fonts offered in the CV customisation panel. They are loaded
      here rather than per template so that a font is already available the
      moment the user selects it, and so the PDF print page can wait on
      document.fonts.ready before rendering.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;600;700&family=Roboto+Slab:wght@300;400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
